[project]
name = "ergon-ai"
version = "0.7.0"
description = "Batteries-included harness for building AI agents (Anthropic, OpenAI-compatible, Ollama, Gemini, Bedrock): tool loops, persistence, compaction, approval, streaming, eval, browser control."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ergon contributors" }]
keywords = [
    "ai", "agents", "agent-framework", "llm", "tool-use",
    "anthropic", "openai", "gemini", "bedrock", "ollama", "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/shipitamit/ergon"
Repository = "https://github.com/shipitamit/ergon"
Issues = "https://github.com/shipitamit/ergon/issues"
Changelog = "https://github.com/shipitamit/ergon/blob/main/CHANGELOG.md"

[project.scripts]
ergon = "ergon.cli:main"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
bedrock = ["boto3>=1.34"]
browser = ["playwright>=1.40"]
mcp = ["mcp>=1.0"]
rag = ["openai>=1.40"]
pgvector = ["psycopg>=3.1"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Ship only the ergon package — keep tests/ out of the wheel so it doesn't
# install as a top-level `tests` module.
[tool.setuptools.packages.find]
include = ["ergon*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
