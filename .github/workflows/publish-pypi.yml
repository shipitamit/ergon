name: Publish SDK to PyPI

# Builds and publishes the Python SDK (sdk/) when a version tag is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
#
# One-time setup on PyPI before this can run:
#   pypi.org → your project (or "pending publisher") → Publishing →
#   add a GitHub trusted publisher:
#     owner: shipitamit   repo: ergon
#     workflow: publish-pypi.yml   environment: pypi
#
# After that, publishing a release is just: git tag vX.Y.Z && git push --tags
# (make sure sdk/pyproject.toml version matches the tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read       # needed to check out a private repo (a permissions
                           # block replaces the defaults, so this must be explicit)
      id-token: write      # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        working-directory: sdk
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata renders
        working-directory: sdk
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist/
          skip-existing: true     # a re-run won't fail if the version is already on PyPI
